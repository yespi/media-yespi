# Sin "docker build" — solo imagen Python + ffmpeg en el primer arranque.
# Misma variable MEDIA_PORTAL_ROOT que en docker-compose.yml
name: media-portal

services:
  media-portal:
    image: python:3.12-slim-bookworm
    container_name: media-portal
    restart: unless-stopped
    ports:
      - "${PORT:-8098}:8098"
    environment:
      HOST: "0.0.0.0"
      PORT: "8098"
      MEDIA_ROOT: /data/gopro
      USERS_FILE: /config/users.json
      AUTH_DISABLED: "${AUTH_DISABLED:-1}"
      AUTH_PUBLIC_READ: "${AUTH_PUBLIC_READ:-0}"
      FFMPEG_VENC: "${FFMPEG_VENC:-libx264}"
      FFMPEG_PRESET: "${FFMPEG_PRESET:-veryfast}"
      PORTAL_BRAND: "${PORTAL_BRAND:-}"
      PORTAL_LOGO_URL: "${PORTAL_LOGO_URL:-}"
      PORTAL_LOGO_FILE: "${PORTAL_LOGO_FILE:-/config/logo.png}"
    volumes:
      - ${MEDIA_PORTAL_ROOT:-.}/app.py:/app/app.py:ro
      - ${MEDIA_PORTAL_ROOT:-.}/entrypoint-nobuild.sh:/entrypoint.sh:ro
      - ${MEDIA_PORTAL_ROOT:-.}/data/gopro:/data/gopro
      - ${MEDIA_PORTAL_ROOT:-.}/config:/config:ro
      - media-portal-ffmpeg-state:/var/lib/media-portal
    entrypoint: ["/bin/bash", "/entrypoint.sh"]

volumes:
  media-portal-ffmpeg-state:
