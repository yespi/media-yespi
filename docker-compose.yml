# MEDIA_PORTAL_ROOT = carpeta del código (build). STATE_DIR = config + vídeos (persistente, fuera de git pull).
# Portainer: MEDIA_PORTAL_ROOT=/home/odt/media-yespi  STATE_DIR=/home/odt/media-portal-state
name: media-portal

services:
  media-portal:
    build:
      context: ${MEDIA_PORTAL_ROOT:-.}
      dockerfile: Dockerfile
    container_name: media-portal
    restart: unless-stopped
    ports:
      - "${PORT:-8098}:8098"
    env_file:
      - ${STATE_DIR:-./state}/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8098"
      MEDIA_ROOT: /data/gopro
      USERS_FILE: /config/users.json
      # Valores fijos (modo B): Portainer a veces no aplica ${VAR:-default} y deja AUTH_* vacío → pide Google y reinicia.
      AUTH_DISABLED: "0"
      AUTH_PUBLIC_READ: "1"
      AUTH_LOCAL: "1"
      FFMPEG_VENC: "${FFMPEG_VENC:-libx264}"
      FFMPEG_PRESET: "${FFMPEG_PRESET:-veryfast}"
      PORTAL_BRAND: "${PORTAL_BRAND:-}"
      PORTAL_LOGO_URL: "${PORTAL_LOGO_URL:-}"
      PORTAL_LOGO_FILE: "${PORTAL_LOGO_FILE:-/config/logo.png}"
    volumes:
      - ${STATE_DIR:-./state}/data/gopro:/data/gopro
      - ${STATE_DIR:-./state}/config:/config:ro
