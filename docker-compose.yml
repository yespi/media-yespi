# Ruta en la Pi donde descomprimiste el ZIP (carpeta que contiene app.py y Dockerfile).
# En Portainer: Stack → Environment variables → MEDIA_PORTAL_ROOT=/ruta/completa
name: media-portal

services:
  media-portal:
    build:
      context: ${MEDIA_PORTAL_ROOT:-.}
      dockerfile: Dockerfile
    container_name: media-portal
    restart: unless-stopped
    ports:
      - "${PORT:-8098}:8098"
    # No usamos env_file: en Portainer suele faltar .env y el stack no crea ningún contenedor.
    # Crea .env en la carpeta del proyecto solo si quieres cambiar PORT / AUTH_* (sustitución ${...}).
    environment:
      HOST: "0.0.0.0"
      PORT: "8098"
      MEDIA_ROOT: /data/gopro
      USERS_FILE: /config/users.json
      # Valores fijos (modo B): Portainer a veces no aplica ${VAR:-default} y deja AUTH_* vacío → pide Google y reinicia.
      AUTH_DISABLED: "0"
      AUTH_PUBLIC_READ: "1"
      AUTH_LOCAL: "1"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-generate-with-openssl-rand-hex-32}"
      FFMPEG_VENC: "${FFMPEG_VENC:-libx264}"
      FFMPEG_PRESET: "${FFMPEG_PRESET:-veryfast}"
      PORTAL_BRAND: "${PORTAL_BRAND:-}"
      PORTAL_LOGO_URL: "${PORTAL_LOGO_URL:-}"
      PORTAL_LOGO_FILE: "${PORTAL_LOGO_FILE:-/config/logo.png}"
    volumes:
      - ${MEDIA_PORTAL_ROOT:-.}/data/gopro:/data/gopro
      - ${MEDIA_PORTAL_ROOT:-.}/config:/config:ro
